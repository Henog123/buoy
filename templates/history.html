<!DOCTYPE html>
<html>
<head>
    <title>Science Probe</title>
    <style>
        
        h1 {
            color: white;
        }
        h2 {
            text-align: center;
        }
        #map {
            height: 400px;
            width: 80%;
            margin: 0 auto;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 0 auto;
            margin-bottom: 40px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        #header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        #nav {
            margin-top: 10px;
        }
        #nav a {
            margin: 0 10px;
            text-decoration: none;
            color: white;
        }
        #nav a:hover {
            text-decoration: underline;
        }
        .container {
            margin: 20px;
        }
        
    </style>
    <!-- Add Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

</head>
<body>

    <div id="header">
        <h1>Science Probe Dashboard</h1>
        <div id="nav">
            <a href="/">Home</a>
            <a href="/history/1">View History</a>
            <a href="/settings">Settings</a>
        </div>
    </div>

    
    <h2>Tracker History - ID: {{ tracker_data[0].tracker_id }}</h2>

    <!-- Map Container -->
    <div id="map"></div>

    <div id="windSpeedChart" style="width: 100%; height: 400px;"></div>
    <div id="waterTempChart" style="width: 100%; height: 400px;"></div>
       

    <!-- Add Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
// Initialize the map
var map = L.map('map').setView([0, 0], 2);  // Default to world view

// Add OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
}).addTo(map);

// Add markers for each location
var locations = [
    {% for data in tracker_data %}
        {
            tracker_id: "{{ data.tracker_id }}",
            lat: {{ data.lat }},
            lon: {{ data.lon }},
            wind_speed: {{ data.wind_speed }},
            water_temp: {{ data.water_temp }},
            timestamp: "{{ data.timestamp }}"
        }
        {% if not loop.last %},{% endif %}
    {% endfor %}
];

locations.forEach(function (location) {
    var popupContent = `
        <strong>Tracker:</strong> ${location.tracker_id}<br>
        <strong>Coordinates:</strong> ${location.lat}, ${location.lon}<br>
        <strong>Wind Speed:</strong> ${location.wind_speed} m/s<br>
        <strong>Water Temp:</strong> ${location.water_temp} °C<br>
        <strong>Timestamp:</strong> ${location.timestamp}
    `;
    L.marker([location.lat, location.lon])
        .addTo(map)
        .bindPopup(popupContent);
});

// Create an array of LatLng points from locations
var latlngs = locations.map(function (location) {
    return [location.lat, location.lon];
});

// Draw a polyline connecting the points
if (latlngs.length > 1) {
    var polyline = L.polyline(latlngs, {
        color: 'blue',     // Line color
        weight: 3,         // Line thickness
        opacity: 0.8,      // Line opacity
    }).addTo(map);

    // Fit the map to show the polyline
    map.fitBounds(polyline.getBounds());
}


        
// Center the map to the last location if available
if (locations.length > 0) {
    var bounds = locations.map(function (location) {
        return [location.lat, location.lon];
    });
    map.fitBounds(bounds);
}

// Load Google Charts
google.charts.load('current', {'packages':['corechart']});

// When the charts library is loaded, call the drawChart function
google.charts.setOnLoadCallback(drawChart);


// Function to aggregate data into 5-minute intervals
function aggregateDataToFiveMinutes(locations) {
    var aggregatedData = {};
    
    locations.forEach(function(location) {
        var timestamp = new Date(location.timestamp);
        
        // Round time to the nearest 5-minute interval
        timestamp.setSeconds(0);
        timestamp.setMilliseconds(0);
        var minutes = Math.floor(timestamp.getMinutes() / 5) * 5;
        timestamp.setMinutes(minutes);

        var key = timestamp.toISOString();

        // Check if this interval already exists in aggregatedData
        if (!aggregatedData[key]) {
            aggregatedData[key] = {
                wind_speed_sum: location.wind_speed,
                water_temp_sum: location.water_temp,
                count: 1,
                timestamp: timestamp
            };
        } else {
            aggregatedData[key].wind_speed_sum += location.wind_speed;
            aggregatedData[key].water_temp_sum += location.water_temp;
            aggregatedData[key].count += 1;
        }
    });

    // Convert aggregated data into array format
    var aggregatedLocations = Object.values(aggregatedData).map(function(item) {
        return {
            timestamp: item.timestamp.toISOString(),
            wind_speed: item.wind_speed_sum / item.count,
            water_temp: item.water_temp_sum / item.count
        };
    });

    return aggregatedLocations;
}


function drawChart() {
    var dataWind = new google.visualization.DataTable();
    dataWind.addColumn('datetime', 'Time');
    dataWind.addColumn('number', 'Wind Speed (m/s)');
    
    var dataTemp = new google.visualization.DataTable();
    dataTemp.addColumn('datetime', 'Time');
    dataTemp.addColumn('number', 'Water Temp (°C)');

    // Check if data exceeds 24 hours
    var firstTimestamp = new Date(locations[0].timestamp);
    var lastTimestamp = new Date(locations[locations.length - 1].timestamp);
    var timeDifference = (lastTimestamp - firstTimestamp) / (1000 * 60 * 60); // Hours

    var processedData = locations;

    // Aggregate if data exceeds 24 hours
    if (timeDifference > 24) {
        console.log('Data spans more than 24 hours, switching to 5-minute intervals...');
        processedData = aggregateDataToFiveMinutes(locations);
    }

    // Add rows to wind and temp data tables
    processedData.forEach(function(location) {
        dataWind.addRow([new Date(location.timestamp), location.wind_speed]);
        dataTemp.addRow([new Date(location.timestamp), location.water_temp]);
    });

    var optionsWind = {
        title: 'Wind Speed Over Time',
        legend: { position: 'bottom' },
        hAxis: {
            title: 'Time',
            format: 'MMM d, h:mm a'
        },
        vAxis: {
            title: 'Wind Speed (m/s)'
        }
    };

    var optionsTemp = {
        title: 'Water Temp Over Time',
        legend: { position: 'bottom' },
        hAxis: {
            title: 'Time',
            format: 'MMM d, h:mm a'
        },
        vAxis: {
            title: 'Water Temp (°C)'
        }
    };

    var chartWind = new google.visualization.LineChart(document.getElementById('windSpeedChart'));
    chartWind.draw(dataWind, optionsWind);

    var chartTemp = new google.visualization.LineChart(document.getElementById('waterTempChart'));
    chartTemp.draw(dataTemp, optionsTemp);
}



        


    </script>
</html>
